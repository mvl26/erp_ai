# Generated by /team:onboard or /team:ci setup from the profile (ci.*, cmd.*). Do not edit by hand: change the profile and regenerate, or add a step with /team:ci add-stage (separate PR).
name: team-ci

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: team-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          true
      - name: Lint
        run: pre-commit run --all-files
      - name: Typecheck
        run: echo "::warning::cmd.typecheck is not configured in .team/profile.json — this step checks nothing"
      - name: Test
        run: cd ../.. && bench --site miyano run-tests --app erp_ai
      - name: Build
        run: cd ../.. && bench build --app erp_ai
